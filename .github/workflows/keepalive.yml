name: Keepalive

# Mantiene el repo "activo" para que GitHub no desactive
# automáticamente los workflows programados (cron) tras 60 días
# de inactividad. Hace un commit trivial una vez al mes.

on:
  schedule:
    # Día 1 de cada mes a las 09:00 UTC
    - cron: '0 9 1 * *'
  workflow_dispatch: # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Actualizar timestamp
        run: |
          mkdir -p .github
          date -u +"Última comprobación: %Y-%m-%d %H:%M UTC" > .github/last_keepalive.txt

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last_keepalive.txt
          git diff --staged --quiet || git commit -m "chore: keepalive ping"
          git push
